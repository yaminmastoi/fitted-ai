services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file: .env
    depends_on: [redis]
volumes:
  redis-data:

