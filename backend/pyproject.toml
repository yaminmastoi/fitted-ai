[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitted-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3",
  "asyncpg>=0.30,<1", "redis[hiredis]>=5.1,<6", "arq>=0.28,<1", "httpx>=0.28,<1",
  "Pillow>=11.3,<12", "python-multipart>=0.0.20,<1", "PyJWT[crypto]>=2.10,<3",
  "fal-client>=0.7,<1", "structlog>=25.4,<26", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "I"]
